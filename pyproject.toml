[project]
name = "corporate-knowledge-assistant"
version = "0.1.0"
description = "Intelligent Corporate Knowledge Assistant API using FastAPI, FAISS, and RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pypdf>=4.1.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.0.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
